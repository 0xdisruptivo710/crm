name: Deploy API image

# Builda a imagem da API no GitHub Actions e publica no GHCR — o droplet (EasyPanel)
# nunca builda, só puxa a imagem pronta.
on:
  push:
    # TEMP: plano-b-pipeline-evolution adicionada só para provar o build antes do merge
    # (workflow_dispatch exige que o arquivo já exista na branch default — GitHub 404
    # "workflow not found on the default branch" — remover esta linha após a 1a run verde).
    branches: [master, plano-b-pipeline-evolution]
    paths:
      - "apps/**"
      - "packages/**"
      - "apps/api/Dockerfile"
      - "pnpm-lock.yaml"
  # Permite buildar a PRIMEIRA imagem a partir desta branch, antes do merge em master.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 0xdisruptivo710/crm-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
