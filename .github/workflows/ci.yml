name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aios_pocket
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/aios_pocket
      REDIS_URL: redis://localhost:6379
      SUPABASE_URL: https://example.supabase.co
      APP_ENCRYPTION_KEY: CTsyIGgQZbdhAtVZDdWLmeYUFrsGxJCVyBqNbGVw5CE=
      # Dummies só para o `next build` conseguir rodar no CI (apps/web) — nenhum
      # valor real trafega aqui; produção lê as envs de verdade na Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      NEXT_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # scripts de package usam `dotenv -e ../../.env` — no CI o arquivo não existe; cria vazio
      - run: touch .env
      - run: pnpm --filter @aios-pocket/db run db:generate
      - run: pnpm --filter @aios-pocket/db run db:deploy
      # Shadow database DEDICADO para o drift check — NUNCA reutilizar DATABASE_URL
      # como shadow: o Prisma RESETA o shadow (replay das migrações); reutilizar o
      # banco vivo pode apagar todos os dados (anti-pattern documentado do Prisma).
      - run: echo 'CREATE DATABASE aios_pocket_shadow;' | pnpm --filter @aios-pocket/db exec prisma db execute --stdin --url "postgresql://postgres:postgres@localhost:55432/postgres"
      # Detecta schema.prisma editado sem migração gerada (drift silencioso)
      - run: >
          pnpm --filter @aios-pocket/db exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://postgres:postgres@localhost:55432/aios_pocket_shadow"
          --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:arch
      # Pega erro de build do Next (apps/web) — barato, roda só o pacote web.
      - run: pnpm --filter web build
